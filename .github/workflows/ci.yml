name: Defense Avionics CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  avionics-build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Node Dependencies
      run: npm ci

    - name: Run Avionics & Dynamics Unit Tests (Vitest)
      run: npm test

    - name: Compile & Bundle Production Dist (Vite)
      run: npm run build

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify Python SITL Bridge Syntax
      run: python -m py_compile python_sitl/mavlink_bridge.py
